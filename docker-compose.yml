services:
  scatterid-app:
    build: .
    container_name: scatterid-app
    restart: unless-stopped
    ports:
      - "${PORT_APP:-8080}:8080"
    environment:
      - PORT=8080
      - GATEWAY_URL=${GATEWAY_URL:-http://verification-api:3000}
      - VERIFICATION_API_KEY=${VERIFICATION_API_KEY:-}
    networks:
      - scatterid_net

networks:
  scatterid_net:
    name: scatterid_net
    external: true
